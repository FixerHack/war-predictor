# Single source of truth for the project plan.
# `uv run tension-index roadmap` renders PLAN.md, PLAN.en.md and the GitHub Pages
# progress site from this file. Edit here, never in the generated files.
#
# After each finished task (see CLAUDE.md):
#   - set its status: done | in_progress | todo | blocked; add note_uk/note_en if useful;
#   - bump project.version: +0.0.1 per task, +0.1.0 per finished stage; set project.updated;
#   - add an entry to the top of `changelog`; new decisions -> `decisions`, risks -> `risks`.
# days:  rough effort estimate, used to weight progress
# owner: claude (default) | human (accounts, secrets, server access, decisions)

project:
  name_uk: "Індекс напруги: Європа"
  name_en: "Tension Index: Europe"
  repo: FixerHack/war-predictor
  version: 0.2.90
  updated: 2026-09-30

milestones:
  - id: M1
    uk: "MVP: 14 днів автономного збору, бал 7+ для України до 24.02.2022 на історії, кожне сповіщення з поясненням"
    en: "MVP: 14 days of unattended collection, backtest scores Ukraine 7+ before 2022-02-24, every alert explained"

stages:
  - id: S0
    branch: dev-bootstrap
    uk: Фундамент та інфраструктура
    en: Foundation & infrastructure
    goal_uk: "Репозиторій, робоче середовище на MacBook і сервері, ключі, Telegram-бот."
    goal_en: "Repository, working environment on the MacBook and server, keys, Telegram bot."
    tasks:
      - {id: S0.1, status: done, days: 0.2, uk: "Репозиторій, гілка main за замовчуванням, правила іменування гілок", en: "Repository, main as default branch, branch naming rules"}
      - {id: S0.2, status: done, days: 0.5, uk: "Python 3.12 + uv, структура пакета, CLI tension-index", en: "Python 3.12 + uv, package layout, tension-index CLI"}
      - {id: S0.3, status: done, days: 0.5, uk: "SQLite-сховище з міграціями, повні версії текстів", en: "SQLite storage with migrations, full text versions"}
      - {id: S0.4, status: done, days: 0.5, uk: "Healthcheck (CLI, скрипт, таймер systemd, алерт у Telegram, dead-man ping)", en: "Healthcheck (CLI, script, systemd timer, Telegram alert, dead-man ping)"}
      - {id: S0.5, status: done, days: 0.5, uk: "Скрипти запуску, деплою і встановлення на сервер (systemd)", en: "Run, deploy and server install scripts (systemd)"}
      - {id: S0.6, status: done, days: 0.3, uk: "CI: ruff + pytest через uv", en: "CI: ruff + pytest via uv"}
      - {id: S0.7, status: done, days: 0.5, uk: "План + сторінка прогресу на GitHub Pages", en: "Plan + progress page on GitHub Pages"}
      - {id: S0.8, status: done, days: 0.3, uk: "README українською та англійською", en: "README in Ukrainian and English"}
      - {id: S0.9, status: done, days: 0.3, owner: human, uk: "MacBook: встановити uv і Claude Code, клонувати репозиторій, ./scripts/bootstrap.sh", en: "MacBook: install uv and Claude Code, clone the repo, ./scripts/bootstrap.sh"}
      - {id: S0.10, status: done, days: 0.2, owner: human, uk: "OpenRouter: поповнення, ключ API (OPENROUTER_API_KEY у .env), ліміт витрат", en: "OpenRouter: top-up, API key (OPENROUTER_API_KEY in .env), spend limit", note_uk: "Замість OpenRouter класифікатор працює через локальний Claude Code за підпискою (CLASSIFIER_PROVIDER=claude_code).", note_en: "Instead of OpenRouter the classifier runs through the local Claude Code CLI on a subscription (CLASSIFIER_PROVIDER=claude_code)."}
      - {id: S0.11, status: done, days: 0.2, owner: human, uk: "Створити бота в @BotFather, тестовий канал, заповнити .env", en: "Create bot via @BotFather, test channel, fill in .env"}
      - {id: S0.12, status: todo, days: 0.5, owner: human, uk: "Перший деплой на сервер: install_server.sh, перевірка healthcheck", en: "First server deploy: install_server.sh, verify healthcheck", note_uk: "Відкладено: спершу бот і система.", note_en: "Postponed: bot and system first."}
      - {id: S0.13, status: done, days: 0.2, owner: human, uk: "Увімкнути GitHub Pages: Source → Deploy from a branch → gh-pages / root", en: "Enable GitHub Pages: Source → Deploy from a branch → gh-pages / root", note_uk: "Працює: fixerhack.github.io/war-predictor", note_en: "Live: fixerhack.github.io/war-predictor"}
      - {id: S0.15, status: todo, days: 0.2, owner: human, uk: "Зняти блокування GitHub Actions: Settings → Billing and plans (рахунок / картка)", en: "Unlock GitHub Actions: Settings → Billing and plans (invoice / card)", note_uk: "CI не стартує: «account is locked due to a billing issue».", note_en: "CI does not start: \"account is locked due to a billing issue\"."}
      - {id: S0.16, status: done, days: 0.2, uk: "Публікація сторінки прогресу без Actions (make pages → гілка gh-pages)", en: "Publish the progress page without Actions (make pages → gh-pages branch)"}
      - {id: S0.14, status: todo, days: 0.2, owner: human, uk: "Захист гілки main (тільки через PR, CI зелений); видалити гілку claude/funny-planck-leoxip", en: "Protect main (PR only, CI green); delete branch claude/funny-planck-leoxip"}

  - id: S1
    branch: "—"
    uk: Вхідні рішення
    en: Input decisions
    goal_uk: "Зафіксувати обсяг, формат і джерела."
    goal_en: "Fix scope, format and sources."
    tasks:
      - {id: S1.1, status: done, days: 0.1, uk: "Країни: ЄС-27, Велика Британія, Норвегія, Швейцарія, Ісландія, Молдова, Західні Балкани (38)", en: "Countries: EU-27, UK, Norway, Switzerland, Iceland, Moldova, Western Balkans (38)", note_uk: "Україну не включено: активна війна, шкала там постійно максимальна.", note_en: "Ukraine excluded: active war keeps the scale at maximum."}
      - {id: S1.2, status: done, days: 0.1, uk: "Формат: публічний сервіс", en: "Format: public service"}
      - {id: S1.3, status: done, days: 0.1, uk: "Джерела рекомендацій: США, Велика Британія, Ізраїль, Канада, Австралія, Німеччина, Франція + МЗС РФ і Білорусі", en: "Advisory sources: US, UK, Israel, Canada, Australia, Germany, France + Russian and Belarusian MFA"}
      - {id: S1.4, status: in_progress, days: 0.2, owner: human, uk: "Затвердити перелік джерел (docs/sources.md)", en: "Approve the source list (docs/sources.md)", note_uk: "Каталог джерел із доступом і статусом перевірки готовий, потрібне затвердження.", note_en: "Source catalogue with access and verification status is ready, needs approval."}
      - {id: S1.5, status: done, days: 0.1, uk: "Розробка: власник проєкту + Claude Code; сервер власний", en: "Development: project owner + Claude Code; own server"}
      - {id: S1.6, status: done, days: 0.1, uk: "Бюджет: безкоштовний стек, платний лише Claude API (ліміт 10–20 $)", en: "Budget: free stack, only Claude API is paid (10–20 $ cap)"}
      - {id: S1.7, status: todo, days: 0.3, owner: human, uk: "Текст юридичного застереження (не прогноз, не порада)", en: "Legal disclaimer text (not a forecast, not advice)"}
      - {id: S1.8, status: done, days: 0.5, uk: "Алгоритм шкали 0–10 (docs/algorithm.md)", en: "0–10 scale algorithm (docs/algorithm.md)"}
      - {id: S1.9, status: done, days: 0.5, uk: "Ресьорч джерел і трекерів війн (docs/sources.md)", en: "Research of sources and war trackers (docs/sources.md)"}

  - id: S2
    branch: dev-collector
    uk: Збір офіційних рекомендацій
    en: Official advisory collection
    goal_uk: "Регулярне отримання рекомендацій зі збереженням кожної версії тексту."
    goal_en: "Regular collection of advisories, storing every text version."
    tasks:
      - {id: S2.1, status: done, days: 0.5, uk: "Каркас джерел, збереження версій, виявлення змін (diff)", en: "Source framework, version storage, change detection (diff)"}
      - {id: S2.2, status: done, days: 0.5, uk: "Велика Британія (GOV.UK Content API)", en: "UK (GOV.UK Content API)", note_uk: "Перевірено на живих даних (PL, EE, MD).", note_en: "Verified on live data (PL, EE, MD)."}
      - {id: S2.3, status: done, days: 0.5, uk: "Німеччина (Auswärtiges Amt OpenData API)", en: "Germany (Auswärtiges Amt OpenData API)", note_uk: "Перевірено на живих даних 30.09–01.10.2026.", note_en: "Verified on live data 30 Sep–1 Oct 2026."}
      - {id: S2.4, status: done, days: 1, uk: "США (RSS TAsTWs + сторінки країн + Security Alerts посольств)", en: "US (TAsTWs RSS + country pages + embassy Security Alerts)", note_uk: "Перевірено на живих даних. Стрічка віддає дві розкладки тих самих порад — обидві зводяться до одного канонічного тексту.", note_en: "Verified on live data. The feed serves two layouts of the same advice — both reduce to one canonical text."}
      - {id: S2.5, status: done, days: 0.5, uk: "Канада (open data JSON)", en: "Canada (open data JSON)", note_uk: "Перевірено на живих даних 30.09–01.10.2026.", note_en: "Verified on live data 30 Sep–1 Oct 2026."}
      - {id: S2.6, status: blocked, days: 0.5, uk: "Австралія (Smartraveller destinations-export)", en: "Australia (Smartraveller destinations-export)", note_uk: "Сайт Smartraveller не відповідає на автоматичні запити (експорт і сторінки, перевірено 30.09.2026); вимкнено через DISABLED_SOURCES=au.", note_en: "Smartraveller does not answer automated requests (export and pages, tested 2026-09-30); disabled via DISABLED_SOURCES=au."}
      - {id: S2.7, status: in_progress, days: 0.5, uk: "Франція (diplomatie.gouv.fr, парсинг)", en: "France (diplomatie.gouv.fr, scraping)", note_uk: "Лише текст сторінки, рівень визначає класифікатор; перевірити probe fr", note_en: "Page text only, level set by the classifier; verify with probe fr"}
      - {id: S2.8, status: blocked, days: 0.5, uk: "Ізраїль (NSC travel warnings)", en: "Israel (NSC travel warnings)", note_uk: "Сторінка NSC — JS-застосунок без відомого API; потрібен зразок відповіді. Для Європи вага низька.", note_en: "NSC page is a JS app with no known API; needs a sample response. Low weight for Europe."}
      - {id: S2.9, status: in_progress, days: 1, uk: "МЗС РФ і Білорусі: рекомендації своїм громадянам", en: "Russian and Belarusian MFA advisories to own citizens", note_uk: "Через GDELT: російськомовні публікації про поради МЗС РФ/РБ, 2+ видання = підтверджено.", note_en: "Via GDELT: Russian-language reports of RU/BY MFA advice, 2+ outlets = confirmed."}
      - {id: S2.10, status: done, days: 0.2, uk: "Алерт у Telegram, якщо джерело зламалося", en: "Telegram alert when a source breaks"}
      - {id: S2.11, status: done, days: 0.5, uk: "Очищення тексту від дат оновлення і службових елементів", en: "Strip update dates and boilerplate before diffing"}

      - {id: S2.12, status: in_progress, days: 0.3, uk: "США: стрічка RSS зникла (404) — резерв через API cadataapi.state.gov (RSS/Atom/JSON)", en: "US: RSS feed gone (404) — fallback to the cadataapi.state.gov API (RSS/Atom/JSON)", note_uk: "Формат API перевірено лише на припущеннях; потрібна перевірка probe us.", note_en: "API format only assumed; needs a probe us check."}
  - id: S3
    branch: dev-aviation
    uk: Авіація і повітряний простір
    en: Aviation & airspace
    goal_uk: "Офіційні попередження щодо неба і фактичне падіння трафіку."
    goal_en: "Official airspace warnings and actual traffic drops."
    tasks:
      - {id: S3.1, status: in_progress, days: 1, uk: "EASA Conflict Zone Information Bulletins", en: "EASA Conflict Zone Information Bulletins", note_uk: "Реалізовано (парсинг сторінки); перевірити: tension-index probe easa", note_en: "Implemented (page parsing); verify: tension-index probe easa"}
      - {id: S3.2, status: blocked, days: 1.5, uk: "NOTAM: обмеження і закриття повітряного простору", en: "NOTAM: airspace restrictions and closures", note_uk: "Безкоштовного API NOTAM для Європи немає (EUROCONTROL EAD платний). Обмеження неба беремо з текстів рекомендацій і CZIB.", note_en: "No free European NOTAM API (EUROCONTROL EAD is paid). Airspace limits come from advisory texts and CZIBs."}
      - {id: S3.3, status: in_progress, days: 1, uk: "OpenSky: падіння кількості рейсів за аеропортом", en: "OpenSky: drop in flights per airport", note_uk: "Реалізовано через OpenSky (падіння трафіку); норма з’явиться після ~3 тижнів збору.", note_en: "Implemented via OpenSky (traffic drop); baseline needs ~3 weeks of samples."}

      - {id: S3.6, status: done, days: 0.25, uk: "Падіння авіатрафіку: норма лише з 3+ тижнів, поріг 20 літаків і 3σ, сигнал знімається після відновлення", en: "Air traffic drop: norm only from 3+ weeks, 20-aircraft and 3σ thresholds, signal cleared on recovery", note_uk: "Хибний сигнал LU («3 літаки замість 10») більше не можливий.", note_en: "The false LU signal (\"3 aircraft vs usual 10\") can no longer happen."}
  - id: S4
    branch: dev-news
    uk: Новини, аналітика, внутрішні заходи
    en: News, analysis, domestic measures
    goal_uk: "Незалежні підтвердження з медіа, аналітики, ринків і рішень самої країни."
    goal_en: "Independent confirmation from media, analysis, markets and the country's own measures."
    tasks:
      - {id: S4.1, status: in_progress, days: 1, uk: "RSS рівнів 1–2, тільки заголовки й посилання", en: "Tier 1–2 RSS, headlines and links only", note_uk: "Реалізовано: 13 стрічок у config/feeds.yaml, подія рахується лише з 2+ стрічок; перевірити URL: tension-index probe news", note_en: "Implemented: 13 feeds in config/feeds.yaml, an event counts only from 2+ feeds; check URLs: tension-index probe news"}
      - {id: S4.2, status: in_progress, days: 1, uk: "GDELT: обсяг і тональність по країні", en: "GDELT: volume and tone per country", note_uk: "Реалізовано: сплеск військової тематики vs 60 днів (раз на добу); рахується лише з підтвердженням новинами.", note_en: "Implemented: surge of military coverage vs 60 days (daily); counts only when news confirm."}
      - {id: S4.3, status: in_progress, days: 0.5, uk: "CrisisWatch: погіршення і Conflict Risk Alert", en: "CrisisWatch: deterioration and Conflict Risk Alerts", note_uk: "Через RSS Crisis Group у стрічках новин.", note_en: "Via the Crisis Group RSS in the news feeds."}
      - {id: S4.4, status: in_progress, days: 1, uk: "Внутрішні заходи країни: мобілізація, надзвичайні укази, кордони", en: "Domestic measures: mobilisation, emergency decrees, border closures", note_uk: "З новин: надзвичайний стан, кордони, мобілізація (лише з 2+ стрічок).", note_en: "From news: emergency, borders, mobilisation (2+ feeds only)."}
      - {id: S4.5, status: in_progress, days: 0.5, uk: "Ринки: облігації і курси через ECB Data Portal", en: "Markets: bonds and FX via ECB Data Portal", note_uk: "ЄЦБ: спред 10-річних облігацій до Німеччини і курс валюти (раз на добу).", note_en: "ECB: 10y spread over Germany and FX (daily)."}

  - id: S5
    branch: dev-history
    uk: Історичний архів
    en: Historical archive
    goal_uk: "Старі версії рекомендацій для перевірки шкали на відомих епізодах."
    goal_en: "Past advisory versions to test the scale on known episodes."
    tasks:
      - {id: S5.1, status: done, days: 1, uk: "Завантаження старих версій з Wayback Machine (CDX API)", en: "Download past versions from the Wayback Machine (CDX API)", note_uk: "tension-index history: знімки Wayback (щодня за 45 днів до події, раз на 5 днів раніше) в окрему базу data/history.sqlite3.", note_en: "tension-index history: Wayback captures (daily 45 days before the event, every 5 days earlier) into data/history.sqlite3."}
      - {id: S5.2, status: in_progress, days: 1, uk: "Епізоди: Україна 2021–22, Вірменія/Азербайджан 2020, Ізраїль/Іран 2024–25", en: "Episodes: Ukraine 2021–22, Armenia/Azerbaijan 2020, Israel/Iran 2024–25", note_uk: "Епізоди в config/episodes.yaml (Україна 2022, Азербайджан 2020, Ізраїль 2024, контроль Франція 2016); завантаження потребує мережі, запустити локально.", note_en: "Episodes in config/episodes.yaml (Ukraine 2022, Azerbaijan 2020, Israel 2024, control France 2016); loading needs network, run locally."}

      - {id: S5.5, status: done, days: 0.1, uk: "Архів Wayback: довгі таймаути, повтори при 429/5xx, прогрес у логах", en: "Wayback archive: long timeouts, retries on 429/5xx, progress in logs"}
  - id: S6
    branch: dev-classifier
    uk: Класифікація змін (Claude API)
    en: Change classification (Claude API)
    goal_uk: "Claude визначає причину і тип кожної зміни та перетворює її на сигнал."
    goal_en: "Claude determines the reason and type of each change and turns it into a signal."
    tasks:
      - {id: S6.1, status: done, days: 1, uk: "Промпт і JSON-схема: причина, тип зміни, персонал, кордони, цитата", en: "Prompt and JSON schema: reason, change type, staff, borders, quote"}
      - {id: S6.2, status: done, days: 0.5, uk: "Виклик лише на змінених фрагментах, кешування промпту, ліміт витрат", en: "Call only on changed fragments, prompt caching, spend cap", note_uk: "Лише змінені фрагменти, кеш системного промпту, ліміт викликів CLASSIFIER_MAX_CALLS; без ключа працюють правила.", note_en: "Changed fragments only, cached system prompt, CLASSIFIER_MAX_CALLS cap; rules work without a key."}
      - {id: S6.3, status: todo, days: 1, owner: human, uk: "Ручна перевірка на 50 прикладах", en: "Manual check on 50 examples", note_uk: "Потрібен ключ API і реальні зміни; перевірити 50 класифікацій вручну.", note_en: "Needs an API key and real changes; review 50 classifications by hand."}
      - {id: S6.7, status: done, days: 0.3, uk: "Класифікатор через локальний Claude Code (claude -p, без API-ключа)", en: "Classifier through the local Claude Code CLI (claude -p, no API key)", note_uk: "CLASSIFIER_PROVIDER=claude_code: виклик claude -p зі схемою JSON, без інструментів і без збереження сесій; використовує ліміти підписки. На сервері потрібен claude setup-token.", note_en: "CLASSIFIER_PROVIDER=claude_code: claude -p with a JSON schema, no tools, no saved sessions; uses the subscription's limits. On a server, claude setup-token is needed."}
      - {id: S6.8, status: done, days: 1, uk: "Окремий інструмент claude-gateway: HTTP API (власний, сумісні з OpenAI й Anthropic) і MCP поверх Claude Code", en: "Separate claude-gateway tool: HTTP API (own, OpenAI- and Anthropic-compatible) and MCP on top of Claude Code", note_uk: "gateway/: токен обов'язковий, без інструментів і сесій, ліміт паралельних викликів, systemd-сервіс; tension-index може класифікувати через нього (CLASSIFIER_PROVIDER=gateway).", note_en: "gateway/: token required, no tools or sessions, parallel call limit, systemd service; tension-index can classify through it (CLASSIFIER_PROVIDER=gateway)."}

      - {id: S6.6, status: done, days: 0.1, uk: "Фільтр цитат: уривки сторінок («3 pays») не показуються", en: "Quote filter: page fragments (\"3 pays\") are not shown"}
  - id: S7
    branch: dev-scoring
    uk: Розрахунок балу 0–10
    en: Scoring 0–10
    goal_uk: "Зважена оцінка з модифікаторами, числа в config/weights.yaml."
    goal_en: "Weighted score with modifiers, numbers in config/weights.yaml."
    tasks:
      - {id: S7.1, status: done, days: 1, uk: "Рушій балу: блоки А–Е, стелі, причини, згасання, верифікація, порогові події", en: "Scoring engine: blocks A–F, caps, reasons, decay, verification, floors"}
      - {id: S7.2, status: done, days: 0.5, uk: "Норма країни і відхилення, синхронність держав, регіональна розбіжність", en: "Country baseline and deviation, cross-government synchrony, regional divergence"}
      - {id: S7.3, status: done, days: 1, uk: "Таблиця сигналів і щоденний розрахунок балу для всіх країн", en: "Signals table and daily score computation for all countries", note_uk: "tension-index run: збір → класифікація → сигнали → бал; бал без достатнього покриття не публікується (крім порогових подій).", note_en: "tension-index run: collect → classify → signals → score; no score without enough coverage (except threshold events)."}
      - {id: S7.4, status: done, days: 0.5, uk: "Пояснення балу у сповіщеннях і на панелі", en: "Score explanation in alerts and on the dashboard"}

      - {id: S7.5, status: done, days: 0.5, uk: "Захист від «мерехтіння» джерел (A → B → A) і команда why", en: "Guard against flapping sources (A → B → A) and the why command", note_uk: "Повернення до версії, яку бачили за останні 7 днів, не вважається зміною; такі зміни не дають подій у балі. tension-index why LU показує блоки й активні сигнали.", note_en: "Returning to a version seen within 7 days is not a change; such changes produce no score events. tension-index why LU lists blocks and active signals."}
  - id: S8
    branch: dev-backtest
    uk: Перевірка на історії
    en: Backtesting
    goal_uk: "Шкала має спрацьовувати на відомих епізодах вчасно і без масових хибних тривог."
    goal_en: "The scale must fire on known episodes in time and without mass false alarms."
    tasks:
      - {id: S8.1, status: done, days: 1.5, uk: "Прогін шкали на історичних епізодах", en: "Replay the scale on historical episodes", note_uk: "Архів Wayback, класифікація Claude Haiku 4.5 через Claude Code: Україна-2022 — 7 з 20.12.2021 (за 66 днів); Вірменія–Азербайджан-2020 — реакція 3+ на 2-й день (раптовий напад); Ізраїль-2024 — 7 з початку вікна (виїзд персоналу США); Франція-2016 (контроль) — максимум 3.0. Усі PASS.", note_en: "Wayback archive, Claude Haiku 4.5 classification via Claude Code: Ukraine 2022 — 7 from 20 Dec 2021 (66 days ahead); Armenia–Azerbaijan 2020 — reaction 3+ on day 2 (surprise attack); Israel 2024 — 7 from the window start (US staff departure); France 2016 (control) — max 3.0. All PASS."}
      - {id: S8.2, status: done, days: 0.5, uk: "Звіт про хибні тривоги і пропуски", en: "False alarm and miss report"}
      - {id: S8.3, status: done, days: 1, uk: "Коригування ваг", en: "Weight tuning", note_uk: "Обмежено надбавку за сплеск, звужено синхронність, окрема причина для заходів, пороги неба з двох джерел, нижча вага регіональних попереджень. Перегляд після 30+ днів живої історії.", note_en: "Capped surge bonus, narrowed synchrony, separate measure reason, two-source airspace floors, lower weight for regional warnings. Revisit after 30+ days of live history."}

  - id: S9
    branch: dev-tg-bot
    uk: Telegram-бот і сповіщення
    en: Telegram bot & alerts
    goal_uk: "Бот з вибором мови й країни, панеллю і сповіщеннями з поясненням."
    goal_en: "Bot with language and country choice, a dashboard and explained alerts."
    tasks:
      - {id: S9.1, status: done, days: 0.5, uk: "Базовий бот на aiogram 3 і адмінські команди /status, /collect, /warcheck", en: "Base aiogram 3 bot and admin commands /status, /collect, /warcheck"}
      - {id: S9.2, status: done, days: 1, uk: "Онбординг: мова (укр/англ) → країна → панель", en: "Onboarding: language (uk/en) → country → dashboard"}
      - {id: S9.3, status: done, days: 1, uk: "Інлайн-панель: бал, статус війни, сусіди, зміни за 7 днів; перемикачі сповіщень, країни, мови", en: "Inline dashboard: score, war status, neighbours, 7-day changes; toggles for alerts, country, language"}
      - {id: S9.4, status: done, days: 0.5, uk: "Розсилка змін підписникам країни їхньою мовою", en: "Change alerts to a country's subscribers in their language"}
      - {id: S9.5, status: done, days: 1, uk: "Сповіщення при зміні балу на 1+ з поясненням і цитатою", en: "Alerts on score change of 1+ with explanation and quote", note_uk: "Бал змінився на 1+ → підписникам приходить пояснення з джерелами й цитатами.", note_en: "Score moves by 1+ → subscribers get an explanation with sources and quotes."}
      - {id: S9.6, status: done, days: 0.5, uk: "Щоденний підсумок по регіону", en: "Daily regional digest", note_uk: "Щоденний дайджест (перемикач на панелі, таймер 06:37 UTC): бал, зміна за добу, зростання в регіоні.", note_en: "Daily digest (toggle on the dashboard, 06:37 UTC timer): score, 24 h change, regional rises."}
      - {id: S9.7, status: done, days: 0.5, uk: "Кілька країн на одного користувача", en: "Several countries per user", note_uk: "До 5 країн: список з позначками, перемикання картки кнопками.", note_en: "Up to 5 countries: ticked list, switch the detailed card by buttons."}

  - id: S10
    branch: dev-war-status
    uk: Статус війни
    en: War status
    goal_uk: "Показувати, чи вже йде війна на території країни, окремо від шкали ескалації."
    goal_en: "Show whether a war is already under way on the country's territory, separately from the escalation scale."
    tasks:
      - {id: S10.1, status: done, days: 0.5, uk: "Довідник config/conflicts.yaml на основі RULAC (Молдова, Кіпр — окупація; сусідство з війною і агресором)", en: "Curated config/conflicts.yaml based on RULAC (Moldova, Cyprus — occupation; borders with war and aggressor)"}
      - {id: S10.2, status: done, days: 0.5, uk: "Щоденна звірка з Wikipedia, розбіжності адміну (war-check)", en: "Daily check against Wikipedia, mismatches to admins (war-check)"}
      - {id: S10.3, status: todo, days: 0.5, owner: human, uk: "Отримати токен UCDP API", en: "Obtain a UCDP API token"}
      - {id: S10.4, status: blocked, days: 0.5, uk: "UCDP Candidate Events як друге автоматичне джерело", en: "UCDP Candidate Events as a second automatic source", note_uk: "Чекає токена UCDP (S10.3).", note_en: "Waiting for the UCDP token (S10.3)."}
      - {id: S10.5, status: done, days: 0.3, uk: "Перевірити парсер Wikipedia на живій сторінці", en: "Verify the Wikipedia parser against the live page", note_uk: "Перевірено на живій сторінці: розділи, колонка Location; Франція (Французька Гвіана) виключена вручну.", note_en: "Verified on the live page: sections, Location column; France (French Guiana) excluded by review."}

  - id: S11
    branch: dev-dashboard
    uk: Публічна панель
    en: Public dashboard
    goal_uk: "Карта країн і історія балу на безкоштовному хостингу."
    goal_en: "Country map and score history on free hosting."
    tasks:
      - {id: S11.1, status: done, days: 0.5, uk: "Експорт scores.json (публічне API тільки для читання)", en: "Export scores.json (read-only public API)", note_uk: "tension-index export → dashboard/scores.json (бал, рівень, причини, статус війни, 90 днів історії).", note_en: "tension-index export → dashboard/scores.json (score, level, reasons, war status, 90-day history)."}
      - {id: S11.2, status: done, days: 1, uk: "Карта Європи з кольорами рівнів", en: "Map of Europe coloured by level", note_uk: "Карта-сітка 38 країн, одновідтінкова шкала, перевірена на кольоросліпість, у світлій і темній темах.", note_en: "Tile map of 38 countries, single-hue scale validated for colour blindness, light and dark."}
      - {id: S11.3, status: done, days: 1, uk: "Сторінка країни: історія балу і пояснення змін", en: "Country page: score history and change explanations", note_uk: "Картка країни: бал, причини з цитатами, позначки, статус війни, графік 90 днів; таблиця всіх країн; посилання #PL.", note_en: "Country card: score, reasons with quotes, flags, war status, 90-day chart; table of all countries; #PL links."}
      - {id: S11.4, status: in_progress, days: 0.3, owner: human, uk: "Юридичне застереження і методологія на сайті", en: "Disclaimer and methodology on the site", note_uk: "Робочий текст застереження й методології на сторінці; остаточний текст затверджує власник (S1.7).", note_en: "Working disclaimer and methodology on the page; final wording approved by the owner (S1.7)."}
      - {id: S11.6, status: done, days: 0.3, uk: "Пояснення українською: короткий виклад від класифікатора замість англійської цитати (карта, бот, сповіщення)", en: "Ukrainian explanations: the classifier's summary instead of the English quote (map, bot, alerts)", note_uk: "Цитати англійською лишаються для ENG і там, де українського викладу ще немає (новини, класифікація правилами).", note_en: "English quotes remain for ENG and where no Ukrainian summary exists yet (news, rule-based classification)."}
      - {id: S11.7, status: done, days: 0.5, uk: "Карта: сусіди у війні (Україна, Росія, Білорусь) для контексту; телефонна версія карти й сторінки плану", en: "Map: neighbours at war (Ukraine, Russia, Belarus) for context; phone layout for the map and the plan page", note_uk: "Сусіди не оцінюються шкалою, лише показані штрихуванням; дані в розділі context файлу conflicts.yaml (потребує перегляду людиною).", note_en: "Neighbours are not scored, only hatched for context; data in the context section of conflicts.yaml (needs human review)."}

      - {id: S11.5, status: done, days: 0.5, uk: "Розгорнуте пояснення на карті (укр/англ): підсумок, блоки, що кажуть уряди, що помічено, повна методика", en: "Detailed explanation on the map (uk/en): summary, blocks, what governments say, what was observed, full method"}
  - id: S12
    branch: dev-ops
    uk: Експлуатація
    en: Operations
    goal_uk: "Система працює без ручного втручання і повідомляє про збої."
    goal_en: "The system runs unattended and reports failures."
    tasks:
      - {id: S12.1, status: done, days: 0.2, uk: "Щоденний бекап SQLite з ротацією", en: "Daily SQLite backup with rotation"}
      - {id: S12.2, status: todo, days: 0.3, owner: human, uk: "Dead-man switch на healthchecks.io (безкоштовно)", en: "Dead-man switch on healthchecks.io (free)"}
      - {id: S12.3, status: in_progress, days: 0.5, uk: "Автодеплой з main (GitHub Actions → SSH)", en: "Auto-deploy from main (GitHub Actions → SSH)", note_uk: "Процес .github/workflows/deploy.yml готовий (SSH → scripts/deploy.sh); запрацює після розблокування Actions і секретів DEPLOY_*.", note_en: ".github/workflows/deploy.yml is ready (SSH → scripts/deploy.sh); runs once Actions are unlocked and DEPLOY_* secrets are set."}

      - {id: S12.5, status: todo, owner: human, days: 0.3, uk: "Сервер: встановити Claude Code, claude setup-token, запустити claude-gateway (systemd) за HTTPS-проксі", en: "Server: install Claude Code, claude setup-token, run claude-gateway (systemd) behind an HTTPS proxy"}
  - id: S13
    branch: "—"
    uk: Критерії MVP
    en: MVP criteria
    goal_uk: "Мінімальна робоча версія готова, коли виконано всі три умови."
    goal_en: "The MVP is done when all three conditions hold."
    tasks:
      - {id: S13.1, status: todo, days: 0.5, uk: "14 днів збору поспіль без ручного втручання", en: "14 consecutive days of collection without manual intervention"}
      - {id: S13.2, status: done, days: 0.5, uk: "На епізоді України бал досягає 7+ до 24.02.2022", en: "On the Ukraine episode the score reaches 7+ before 2022-02-24", note_uk: "Бектест на архіві Wayback: 7 з 20.12.2021, за 66 днів до 24.02.2022.", note_en: "Wayback archive backtest: 7 from 20 Dec 2021, 66 days before 24 Feb 2022."}
      - {id: S13.3, status: done, days: 0.3, uk: "Кожне сповіщення містить джерело, опис зміни і цитату", en: "Every alert contains the source, a description of the change and a quote", note_uk: "Сповіщення про зміну рекомендації: джерело, опис (класифікатор) і цитата; про зміну балу: хто, що і цитати.", note_en: "Advisory alerts: source, description (classifier) and quote; score alerts: who, what and quotes."}

decisions:
  - {date: 2026-10-01, uk: "Сусіди у війні показуються на карті лише як контекст (штрихування, без балу); перелік — розділ context у config/conflicts.yaml.", en: "Neighbours at war are shown on the map as context only (hatched, no score); the list is the context section of config/conflicts.yaml."}
  - {date: 2026-09-30, uk: "Раптові напади (Вірменія–Азербайджан-2020) перевіряються на реакцію протягом 3 днів: рекомендації урядів не змінювались до початку боїв.", en: "Surprise attacks (Armenia–Azerbaijan 2020) are tested for a reaction within 3 days: government advice did not change before the fighting began."}
  - {date: 2026-09-30, uk: "Заходи з рекомендацій і пороги рахуються лише з безпекової причини заходу (релевантність ≥ 0.7 для заходів, ≥ 0.5 для порогів).", en: "Advisory measures and floors count only for a security reason for the measure (relevance ≥ 0.7 for measures, ≥ 0.5 for floors)."}
  - {date: 2026-09-30, uk: "Регіональні попередження: Британія «avoid all travel to parts» 0.45, «all but essential to parts» 0.3, Німеччина Teilreisewarnung 0.35 — вони здебільшого стосуються давно окупованих чи прикордонних районів.", en: "Regional warnings: UK \"avoid all travel to parts\" 0.45, \"all but essential to parts\" 0.3, German partial warning 0.35 — they mostly cover long-occupied or border areas."}
  - {date: 2026-09-30, uk: "Пороги неба (8 / 6) — лише за двох незалежних джерел, як і поріг наказу про виїзд персоналу.", en: "Airspace floors (8 / 6) only with two independent sources, like the ordered-departure floor."}
  - {date: 2026-09-30, uk: "Наказ про виїзд лише родин дипломатів = дозволений виїзд персоналу (поріг 7), не наказ про виїзд персоналу (поріг 9 при двох урядах).", en: "Ordered departure of family members only = authorized staff departure (floor 7), not ordered staff departure (floor 9 with two governments)."}
  - {date: 2026-09-30, uk: "Надбавка за відхилення від норми не більше 0.10 до R; синхронність — лише підвищення рівня, статус персоналу, консульські/прикордонні/авіаційні заходи з релевантністю причини ≥ 0.5.", en: "Surge bonus at most 0.10 to R; synchrony counts only level raises, staff posture, consular/border/airspace measures with reason relevance ≥ 0.5."}
  - {date: 2026-09-30, uk: "Класифікація змін: Claude Haiku 4.5 через OpenRouter", en: "Change classification: Claude Haiku 4.5 via OpenRouter"}
  - {date: 2026-09-30, uk: "Заморські території європейських країн не впливають на статус війни; винятки фіксуються вручну в wikipedia_ignore", en: "Overseas territories of European countries do not affect war status; exclusions are recorded by hand in wikipedia_ignore"}
  - {date: 2026-09-30, uk: "Деплой на сервер відкладено; пріоритет — бот і система на MacBook", en: "Server deploy postponed; priority is the bot and system on the MacBook"}
  - {date: 2026-09-27, uk: "Шкала 0–10 замість ймовірності: описує стан сигналів, а не прогнозує війну", en: "0–10 scale instead of a probability: describes signals, does not forecast war"}
  - {date: 2026-09-27, uk: "Рекомендації посольств для країн ЄС і НАТО важать менше: союзники рідко заздалегідь піднімають рівень", en: "Advisories weigh less for EU/NATO members: allies rarely raise levels in advance"}
  - {date: 2026-09-27, uk: "Порівняння з власною нормою країни, а не за абсолютним рівнем", en: "Compare against the country's own baseline, not absolute levels"}
  - {date: 2026-09-30, uk: "Власний сервер (systemd) замість GitHub Actions за розкладом; Python 3.12 + uv, aiogram 3", en: "Own server (systemd) instead of scheduled GitHub Actions; Python 3.12 + uv, aiogram 3"}
  - {date: 2026-09-30, uk: "Гілки: main за замовчуванням, робота в dev-<область>, fix-<що>, docs-<що>", en: "Branches: main by default, work in dev-<area>, fix-<what>, docs-<what>"}
  - {date: 2026-09-30, uk: "Блоки поєднуються як незалежні підтвердження зі стелею внеску кожного блоку", en: "Blocks combine as independent confirmations, each with a contribution cap"}
  - {date: 2026-09-30, uk: "Статус війни окремо від шкали; довідник ведеться вручну, автоматика лише пропонує зміни", en: "War status is separate from the scale; curated by hand, automation only proposes changes"}

risks:
  - {uk: "Шлюз використовує підписку Claude того, хто залогінений: його не можна відкривати стороннім людям; для чужих програм потрібен ключ API.", en: "The gateway uses the signed-in person's Claude subscription: it must not be opened to other people; other people's programs need an API key."}
  - {uk: "Без кредитів OpenRouter класифікація йде лише правилами: причини й статус посольств визначаються грубіше, бал менш точний.", en: "Without OpenRouter credits classification falls back to rules only: reasons and embassy posture are cruder, the score less precise."}
  - {uk: "Справжнє повернення рекомендації до попередньої версії протягом 7 днів не буде окремою зміною (стан однаково оновлюється).", en: "A genuine revert of an advisory within 7 days is not reported as a change (the state still updates)."}
  - {uk: "Частина урядових сайтів блокує автоматичні запити (Австралія); джерело можна втратити без попередження", en: "Some government sites block automated requests (Australia); a source can be lost without notice"}
  - {uk: "GitHub Actions заблоковані через білінг акаунта: CI не перевіряє зміни, до розблокування перевірки лише локально (make check)", en: "GitHub Actions locked by an account billing issue: no CI until unlocked, checks run locally only (make check)"}
  - {uk: "Блокування збору: сайти держав можуть блокувати запити з сервера", en: "Collection blocking: government sites may block requests from the server"}
  - {uk: "Умови використання: Reuters і AP без відкритих RSS; ліцензія ACLED для публічного сервісу", en: "Terms of use: no open Reuters/AP RSS; ACLED licence for a public service"}
  - {uk: "Публічна відповідальність: бал сприймуть як прогноз; потрібні застереження і методологія", en: "Public responsibility: the score will be read as a forecast; disclaimer and methodology needed"}
  - {uk: "Неперевірені ваги: до етапу S8 це експертна гіпотеза", en: "Untested weights: an expert hypothesis until stage S8"}
  - {uk: "Автоматичні трекери війн згадують країни, зачеплені лише побічно; потрібна ручна перевірка", en: "Automatic war trackers list countries hit only by spillover; manual review needed"}

changelog:
  - version: 0.2.90
    date: 2026-10-01
    uk: ["Новий окремий інструмент claude-gateway: будь-яка програма може звертатися до Claude Code на сервері через HTTP (власний формат, OpenAI- чи Anthropic-сумісний) або MCP.", "Класифікатор tension-index може працювати через шлюз (CLASSIFIER_PROVIDER=gateway)."]
    en: ["New separate tool claude-gateway: any program can call Claude Code on the server over HTTP (own format, OpenAI- or Anthropic-compatible) or MCP.", "The tension-index classifier can run through the gateway (CLASSIFIER_PROVIDER=gateway)."]
  - version: 0.2.88
    date: 2026-10-01
    uk: ["Карта показує Україну (війна), Росію (агресор) і Білорусь (територію використано для нападу) — для контексту, без балу.", "Телефонна версія: карта без горизонтальної прокрутки, панель країни прокручується до видимої області, таблиця клікабельна; на сторінці плану можна сховати виконані завдання, журнал змін згорнуто після 15 записів.", "Виправлено: записи журналу змін одним рядком ламали PLAN.md і сторінку плану."]
    en: ["The map shows Ukraine (war), Russia (aggressor) and Belarus (territory used for the attack) for context, without a score.", "Phone layout: no horizontal scroll on the map, the country panel scrolls into view, the table is clickable; the plan page can hide finished tasks and folds the changelog after 15 entries.", "Fixed: changelog entries written as one string broke PLAN.md and the plan page."]
  - version: 0.2.87
    date: 2026-09-30
