      - {id: S10.2, status: todo, days: 1.5, uk: "Карта Європи з рівнями і історія балу по країні", en: "Map of Europe with levels and per-country score history"}
      - {id: S10.3, status: todo, days: 0.3, uk: "Застереження і методологія на сторінці", en: "Disclaimer and methodology on the page"}

  - id: S11
    branch: dev-ops
    uk: Експлуатація
    en: Operations
    tasks:
      - {id: S11.1, status: done, days: 0.2, uk: "Щоденний бекап SQLite з ротацією", en: "Daily SQLite backup with rotation"}
      - {id: S11.2, status: todo, days: 0.3, owner: dmytro, uk: "Dead-man switch на healthchecks.io (безкоштовно)", en: "Dead-man switch on healthchecks.io (free)"}
      - {id: S11.3, status: todo, days: 0.5, uk: "Автодеплой з main (GitHub Actions → SSH)", en: "Auto-deploy from main (GitHub Actions → SSH)"}
      - {id: S11.4, status: todo, days: 0.5, uk: "14 днів безперервного збору без ручного втручання", en: "14 days of continuous collection without manual intervention"}

