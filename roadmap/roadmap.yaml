decisions:
  - {date: 2026-09-30, uk: "Класифікація змін: Claude Haiku 4.5 через OpenRouter", en: "Change classification: Claude Haiku 4.5 via OpenRouter"}
  - {date: 2026-09-30, uk: "Заморські території європейських країн не впливають на статус війни; винятки фіксуються вручну в wikipedia_ignore", en: "Overseas territories of European countries do not affect war status; exclusions are recorded by hand in wikipedia_ignore"}
  - {date: 2026-09-30, uk: "Деплой на сервер відкладено; пріоритет — бот і система на MacBook", en: "Server deploy postponed; priority is the bot and system on the MacBook"}
  - {date: 2026-09-27, uk: "Шкала 0–10 замість ймовірності: описує стан сигналів, а не прогнозує війну", en: "0–10 scale instead of a probability: describes signals, does not forecast war"}
  - {date: 2026-09-27, uk: "Рекомендації посольств для країн ЄС і НАТО важать менше: союзники рідко заздалегідь піднімають рівень", en: "Advisories weigh less for EU/NATO members: allies rarely raise levels in advance"}
  - {date: 2026-09-27, uk: "Порівняння з власною нормою країни, а не за абсолютним рівнем", en: "Compare against the country's own baseline, not absolute levels"}
  - {date: 2026-09-30, uk: "Власний сервер (systemd) замість GitHub Actions за розкладом; Python 3.12 + uv, aiogram 3", en: "Own server (systemd) instead of scheduled GitHub Actions; Python 3.12 + uv, aiogram 3"}
  - {date: 2026-09-30, uk: "Гілки: main за замовчуванням, робота в dev-<область>, fix-<що>, docs-<що>", en: "Branches: main by default, work in dev-<area>, fix-<what>, docs-<what>"}
  - {date: 2026-09-30, uk: "Блоки поєднуються як незалежні підтвердження зі стелею внеску кожного блоку", en: "Blocks combine as independent confirmations, each with a contribution cap"}
  - {date: 2026-09-30, uk: "Статус війни окремо від шкали; довідник ведеться вручну, автоматика лише пропонує зміни", en: "War status is separate from the scale; curated by hand, automation only proposes changes"}

risks:
  - {uk: "Справжнє повернення рекомендації до попередньої версії протягом 7 днів не буде окремою зміною (стан однаково оновлюється).", en: "A genuine revert of an advisory within 7 days is not reported as a change (the state still updates)."}
  - {uk: "Частина урядових сайтів блокує автоматичні запити (Австралія); джерело можна втратити без попередження", en: "Some government sites block automated requests (Australia); a source can be lost without notice"}
  - {uk: "GitHub Actions заблоковані через білінг акаунта: CI не перевіряє зміни, до розблокування перевірки лише локально (make check)", en: "GitHub Actions locked by an account billing issue: no CI until unlocked, checks run locally only (make check)"}
  - {uk: "Блокування збору: сайти держав можуть блокувати запити з сервера", en: "Collection blocking: government sites may block requests from the server"}
  - {uk: "Умови використання: Reuters і AP без відкритих RSS; ліцензія ACLED для публічного сервісу", en: "Terms of use: no open Reuters/AP RSS; ACLED licence for a public service"}
  - {uk: "Публічна відповідальність: бал сприймуть як прогноз; потрібні застереження і методологія", en: "Public responsibility: the score will be read as a forecast; disclaimer and methodology needed"}
  - {uk: "Неперевірені ваги: до етапу S8 це експертна гіпотеза", en: "Untested weights: an expert hypothesis until stage S8"}
  - {uk: "Автоматичні трекери війн згадують країни, зачеплені лише побічно; потрібна ручна перевірка", en: "Automatic war trackers list countries hit only by spillover; manual review needed"}

changelog:
  - version: 0.2.59
    date: 2026-09-30
    uk: "Карта пояснює бал кожної країни: короткий підсумок, заповненість шести блоків, рівні рекомендацій урядів і всі помічені сигнали з цитатами, плюс повна методика. Прибрано хибні сигнали падіння авіатрафіку для малих країн."
    en: "The map explains every country's score: a short summary, the six blocks, government advice levels and all observed signals with quotes, plus the full method. False air-traffic-drop signals for small countries removed."
  - version: 0.2.57
    date: 2026-09-30
    uk: "Джерела, що перемикаються між двома версіями тексту (як стрічка США), більше не створюють змін і не піднімають бал; нова команда why пояснює бал країни."
    en: "Sources that swing between two text versions (like the US feed) no longer create changes or lift the score; new why command explains a country's score."
  - version: 0.2.56
    date: 2026-09-30
    uk: ["GDELT — окрема щоденна команда і таймер; run більше не чекає на нього", "США: дублікати записів з різним текстом більше не дають хибних змін"]
    en: ["GDELT is its own daily command and timer; run no longer waits for it", "US: duplicate items with different text no longer cause false changes"]
  - version: 0.2.55
    date: 2026-09-30
    uk: ["США: службові примітки про перевидання не рахуються змінами"]
