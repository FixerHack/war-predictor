    uk: Перевірка на історії
    en: Backtesting
    tasks:
      - {id: S8.1, status: todo, days: 1.5, uk: "Відтворення шкали на історичних епізодах", en: "Replay the scale on historical episodes"}
      - {id: S8.2, status: todo, days: 1, uk: "Коригування ваг, звіт про хибні тривоги і пропуски", en: "Weight tuning, false alarm and miss report"}

  - id: S9
    branch: dev-tg-bot
    uk: Telegram-бот і сповіщення
    en: Telegram bot & alerts
    tasks:
      - {id: S9.1, status: done, days: 0.5, uk: "Базовий бот на aiogram 3: /status, /changes, /help, адмінська /collect", en: "Base aiogram 3 bot: /status, /changes, /help, admin /collect"}
      - {id: S9.2, status: todo, days: 1, uk: "Сповіщення при зміні балу на 1+ з поясненням і цитатою", en: "Alerts on score change of 1+ with explanation and quote"}
      - {id: S9.3, status: todo, days: 0.5, uk: "/country XX: поточний бал, історія, причини", en: "/country XX: current score, history, reasons"}
      - {id: S9.4, status: todo, days: 1, uk: "Підписки користувачів на країни, щотижневий дайджест", en: "User country subscriptions, weekly digest"}

  - id: S10
    branch: dev-dashboard
