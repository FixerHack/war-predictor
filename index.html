<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tension Index · Progress</title>
<meta name="description" content="Development progress of the Tension Index project">
<!-- Rendered from roadmap.json, which `tension-index roadmap` builds from roadmap/roadmap.yaml.
     Do not put project data here. -->
<style>
:root {
  --bg: #EDF0EE; --surface: #F8FAF8; --ink: #1B2430; --ink-2: #4A5563; --line: #CBD2CE;
  --done: #2F6B4F; --progress: #B7791F; --blocked: #A33A2B; --todo: #8A949E; --focus: #2D5B8C;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A20; --surface: #1C242C; --ink: #E4E9EC; --ink-2: #A3AEB8; --line: #34404B;
    --done: #5BA37F; --progress: #D9A043; --blocked: #D46A58; --todo: #6F7A85; --focus: #7FA9D6;
  }
}
:root[data-theme="dark"] {
  --bg: #141A20; --surface: #1C242C; --ink: #E4E9EC; --ink-2: #A3AEB8; --line: #34404B;
  --done: #5BA37F; --progress: #D9A043; --blocked: #D46A58; --todo: #6F7A85; --focus: #7FA9D6;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 24px; }
h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.meta { color: var(--ink-2); font-size: 0.95rem; }
.meta strong { color: var(--ink); }
.controls { display: flex; gap: 6px; }
.btn { font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.rail { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; margin: 8px 0 6px; }
.seg { appearance: none; border: 0; padding: 0; background: none; cursor: pointer; color: inherit; font: inherit; text-align: left; }
.seg .bar { height: 28px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--done); }
.seg .fill.part { background: var(--progress); }
.seg .num { display: block; font-size: 0.75rem; color: var(--ink-2); margin-top: 4px; }
.seg:focus-visible .bar { outline: 2px solid var(--focus); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.85rem; color: var(--ink-2); margin-bottom: 24px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

.next { border-left: 4px solid var(--progress); background: var(--surface); padding: 14px 18px; margin-bottom: 32px; border-radius: 0 6px 6px 0; }
.next p { margin: 0; }
.next .t { font-weight: 600; font-size: 1.05rem; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

.stage { margin-bottom: 28px; scroll-margin-top: 12px; }
.stage h2 { font-size: 1.15rem; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stage h2 .n { color: var(--ink-2); font-weight: 500; }
.stage .count { margin-left: auto; font-size: 0.85rem; color: var(--ink-2); font-weight: 400; white-space: nowrap; }
.stage .goal { color: var(--ink-2); margin: 0 0 4px; font-size: 0.95rem; }
.branch { font: 0.8rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); margin-bottom: 8px; }
ul.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.tasks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); align-items: start; }
.mark { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--todo); margin-top: 4px; }
.s-done .mark { background: var(--done); border-color: var(--done); }
.s-in_progress .mark { border-color: var(--progress); background: linear-gradient(90deg, var(--progress) 50%, transparent 50%); }
.s-blocked .mark { border-color: var(--blocked); background: var(--blocked); border-radius: 2px; }
.s-done .title { color: var(--ink-2); }
.id { color: var(--ink-2); margin-right: 6px; font-size: 0.85rem; }
.note { display: block; font-size: 0.87rem; color: var(--ink-2); margin-top: 2px; }
.owner { font-size: 0.72rem; padding: 1px 6px; border-radius: 8px; border: 1px dashed var(--ink-2); color: var(--ink-2); margin-left: 6px; white-space: nowrap; }
.badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.s-in_progress .badge { border-color: var(--progress); color: var(--progress); }
.s-blocked .badge { border-color: var(--blocked); color: var(--blocked); }
.s-done .badge { border-color: var(--done); color: var(--done); }
@media (max-width: 520px) { ul.tasks li { grid-template-columns: 22px 1fr; } .badge { display: none; } }

aside section { margin-bottom: 28px; }
aside h3 { font-size: 1rem; margin: 0 0 8px; }
.item { font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item .d { color: var(--ink-2); font-size: 0.8rem; display: block; }
.log .v { font-weight: 600; }
.log ul { margin: 4px 0 12px; padding-left: 18px; color: var(--ink-2); font-size: 0.9rem; }
footer { margin-top: 32px; color: var(--ink-2); font-size: 0.8rem; }
a { color: var(--focus); }
@media (prefers-reduced-motion: no-preference) { .seg .fill { transition: width .4s ease; } }
body.hide-done .tasks li.s-done { display: none; }
@media (max-width: 600px) { .controls { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Tension Index</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="controls">
      <button class="btn" data-lang="uk" type="button">УКР</button>
      <button class="btn" data-lang="en" type="button">ENG</button>
      <button class="btn" id="doneBtn" type="button" aria-pressed="false"></button>
      <button class="btn" id="themeBtn" type="button" aria-label="Theme">◐</button>
    </div>
  </header>
  <nav class="rail" id="rail"></nav>
  <div class="legend" id="legend"></div>
  <div class="next" id="next"></div>
  <div class="cols">
    <main id="stages"></main>
    <aside id="aside"></aside>
  </div>
  <footer id="foot"></footer>
</div>
<script>
const T = {
  uk: { version: "Версія", updated: "оновлено", done_of: "Виконано", of: "з", tasks: "завдань",
        in_progress_n: "у роботі", left: "лишилось ≈", days: "дн.",
        done: "виконано", in_progress: "у роботі", todo: "не розпочато", blocked: "заблоковано",
        next: "Наступний крок, етап", all_done: "Усі завдання виконано.", owner: "вручну",
        milestones: "Віхи", decisions: "Зафіксовані рішення", risks: "Ризики", changelog: "Журнал змін",
        ideas: "Ідеї", built: "Зібрано", plan: "План у репозиторії", branch: "гілка",
        hideDone: "Сховати виконані", older: "Старіші зміни", err: "Не вдалося завантажити roadmap.json", title: "хід проєкту", dashboard: "Публічна панель" },
  en: { version: "Version", updated: "updated", done_of: "Done", of: "of", tasks: "tasks",
        in_progress_n: "in progress", left: "≈ left", days: "days",
        done: "done", in_progress: "in progress", todo: "not started", blocked: "blocked",
        next: "Next step, stage", all_done: "All tasks are done.", owner: "manual",
        milestones: "Milestones", decisions: "Decisions", risks: "Risks", changelog: "Changelog",
        ideas: "Ideas", built: "Built", plan: "Plan in the repository", branch: "branch",
        hideDone: "Hide done", older: "Older changes", err: "Failed to load roadmap.json", title: "progress", dashboard: "Public dashboard" },
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let lang = store.get("lang") === "en" ? "en" : "uk";
let data = null;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const doneBtn = document.getElementById("doneBtn");
  doneBtn.textContent = t.hideDone;
  doneBtn.setAttribute("aria-pressed", document.body.classList.contains("hide-done"));
  if (!data) return;
  const p = data.project, s = data.stats, stages = data.stages;
  const name = p["name_" + lang];
  document.getElementById("title").textContent = name;
  document.title = `${name} — ${t.title}`;
  document.getElementById("meta").innerHTML =
    `${t.version} <strong>${esc(p.version)}</strong>, ${t.updated} ${esc(p.updated)}. ` +
    `${t.done_of} <strong>${s.counts.done} ${t.of} ${s.tasks}</strong> ${t.tasks} (<strong>${s.percent}%</strong>), ` +
    `${t.in_progress_n} ${s.counts.in_progress}, ${t.left} ${s.days_left} ${t.days}`;

  const rail = document.getElementById("rail");
  rail.style.setProperty("--n", stages.length);
  rail.innerHTML = stages.map((st) => {
    const d = st.stats.days_by_status, total = st.stats.days_total || 1;
    const w = (100 * d.done / total).toFixed(1), wp = (100 * (d.done + d.in_progress) / total).toFixed(1);
    return `<button class="seg" type="button" data-target="${esc(st.id)}" title="${esc(st[lang])}: ${st.stats.percent}%">
      <div class="bar"><div class="fill part" style="width:${wp}%"></div><div class="fill" style="width:${w}%"></div></div>
      <span class="num">${esc(st.id)}</span></button>`;
  }).join("");
  rail.querySelectorAll(".seg").forEach((b) => b.onclick = () => {
    const el = document.getElementById(b.dataset.target);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });
  document.getElementById("legend").innerHTML = [["done", "--done"], ["in_progress", "--progress"], ["blocked", "--blocked"], ["todo", "--line"]]
    .map(([k, v]) => `<span><span class="dot" style="background:var(${v})"></span>${t[k]}</span>`).join("");

  let nxt = null, nxtStage = null;
  for (const st of stages) {
    const task = st.tasks.find((x) => x.status === "in_progress") || st.tasks.find((x) => x.status !== "done");
    if (task) { nxt = task; nxtStage = st; break; }
  }
  document.getElementById("next").innerHTML = nxt
    ? `<p class="meta">${t.next} ${esc(nxtStage.id)}: ${esc(nxtStage[lang])}</p><p class="t">${esc(nxt[lang])}</p>`
    : `<p class="t">${t.all_done}</p>`;

  document.getElementById("stages").innerHTML = stages.map((st) => `
    <section class="stage" id="${esc(st.id)}">
      <h2><span class="n">${esc(st.id)}</span>${esc(st[lang])}<span class="count">${st.stats.counts.done} ${t.of} ${st.stats.tasks} · ${st.stats.percent}%</span></h2>
      ${st["goal_" + lang] ? `<p class="goal">${esc(st["goal_" + lang])}</p>` : ""}
      <div class="branch">${t.branch}: ${esc(st.branch)}</div>
      <ul class="tasks">${st.tasks.map((x) => `
        <li class="s-${esc(x.status)}"><span class="mark"></span>
          <span><span class="id">${esc(x.id)}</span><span class="title">${esc(x[lang])}</span>${x.owner === "human" ? `<span class="owner">${t.owner}</span>` : ""}
            ${x["note_" + lang] ? `<span class="note">${esc(x["note_" + lang])}</span>` : ""}</span>
          <span class="badge">${t[x.status]}</span></li>`).join("")}
      </ul>
    </section>`).join("");

  const sec = (title, body) => body ? `<section><h3>${title}</h3>${body}</section>` : "";
  document.getElementById("aside").innerHTML =
    sec(t.milestones, (data.milestones || []).map((m) => `<div class="item"><b>${esc(m.id)}</b> · ${esc(m[lang])}</div>`).join("")) +
    sec(t.decisions, (data.decisions || []).map((d) => `<div class="item">${esc(d[lang])}<span class="d">${esc(d.date)}</span></div>`).join("")) +
    sec(t.risks, (data.risks || []).map((r) => `<div class="item">${esc(r[lang])}</div>`).join("")) +
    sec(t.changelog, (() => {
      const item = (c) => `<div><span class="v">${esc(c.version)}</span> <span class="meta">${esc(c.date)}</span><ul>${[].concat(c[lang] || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
      const log = data.changelog || [];
      return `<div class="log">${log.slice(0, 15).map(item).join("")}</div>` +
        (log.length > 15 ? `<details><summary>${esc(t.older)} (${log.length - 15})</summary><div class="log">${log.slice(15).map(item).join("")}</div></details>` : "");
    })()) +
    sec(t.ideas, (data.ideas || []).map((i) => `<div class="item">${esc(i[lang])}</div>`).join(""));

  const repo = esc(p.repo), commit = esc(data.build.commit);
  document.getElementById("foot").innerHTML =
    `${t.built}: ${esc(data.build.built_at.replace("T", " ").replace("+00:00", " UTC"))}` +
    (commit ? ` · <a href="https://github.com/${repo}/commit/${commit}">${commit}</a>` : "") +
    ` · <a href="https://github.com/${repo}/blob/main/${lang === "uk" ? "PLAN.md" : "PLAN.en.md"}">${t.plan}</a>` +
    ` · <a href="dashboard/">${t.dashboard}</a>`;
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); render(); }));
const savedTheme = store.get("theme");
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
// Long task lists: on phones finished tasks are hidden by default (remembered per viewer).
const savedDone = store.get("hideDone");
document.body.classList.toggle("hide-done", savedDone ? savedDone === "1" : matchMedia("(max-width: 600px)").matches);
document.getElementById("doneBtn").addEventListener("click", () => {
  const on = !document.body.classList.contains("hide-done");
  document.body.classList.toggle("hide-done", on); store.set("hideDone", on ? "1" : "0"); render();
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next);
});
render();
fetch("roadmap.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((json) => { data = json; render(); })
  .catch(() => { document.getElementById("stages").innerHTML = `<p>${T[lang].err}</p>`; });
</script>
</body>
</html>
