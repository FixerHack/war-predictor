[project]
name = "tension-index"
version = "0.2.50"
description = "Early-warning tension index (0-10) for European countries based on travel advisories and other open signals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "anthropic>=1.9.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
tension-index = "tension_index.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tension_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# Line length is enforced by `ruff format`; data tables kept on one line use `# fmt: skip`.
ignore = ["E501"]
