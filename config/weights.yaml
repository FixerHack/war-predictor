# Tension scale configuration. See docs/algorithm.md for the maths.
# All numbers are a starting hypothesis; stage S8 (backtesting) tunes them.
version: 1

# Blocks. `cap` = the most a fully alarmed block can contribute on its own (0..1).
# Blocks combine as independent confirmations: R = 1 - prod(1 - cap_k * B_k),
# so one maxed block reaches its cap and every further block pushes R towards 1.
blocks:
  advisories: {cap: 0.60, half_life_days: 30}   # A. official travel advice (state signals)
  aviation:   {cap: 0.60, half_life_days: 7}    # B. CZIB, NOTAM, flight drops
  domestic:   {cap: 0.60, half_life_days: 21}   # C. mobilisation, emergency decrees, shelters, borders
  aggressor:  {cap: 0.40, half_life_days: 14}   # D. RU/BY MFA advice, rhetoric, exercises near border
  media:      {cap: 0.35, half_life_days: 7}    # E. GDELT volume/tone, tier 1-2 news, CrisisWatch
  markets:    {cap: 0.15, half_life_days: 7}    # F. bond spreads, FX

# Allies rarely raise advisories for NATO/EU members in advance (political cost),
# so the advisory block counts less there and the other blocks count more.
group_block_multipliers:
  nato_eu: {advisories: 0.75}

# How much an advisory change matters depending on the stated reason (from the classifier).
reason_relevance:
  armed_conflict: 1.0
  military_threat: 1.0
  hybrid_attack: 0.7      # sabotage, drones over infrastructure, GPS jamming
  civil_unrest: 0.3
  terrorism: 0.2
  unknown: 0.5
  crime: 0.05
  health: 0.05
  natural_disaster: 0.05

# Advisory level -> strength 0..1, per publishing government.
advisory_levels:
  us: {"1": 0.0, "2": 0.2, "3": 0.55, "4": 0.85}
  gov_uk:
    none: 0.0
    avoid_all_but_essential_travel_to_parts: 0.4
    avoid_all_but_essential_travel_to_whole_country: 0.6
    avoid_all_travel_to_parts: 0.7
    avoid_all_travel_to_whole_country: 0.85
  ca: {"normal": 0.0, "high_caution": 0.2, "avoid_non_essential": 0.55, "avoid_all": 0.85}
  au: {"1": 0.0, "2": 0.2, "3": 0.55, "4": 0.85}
  de: {"none": 0.0, "security_notice": 0.2, "partial_warning": 0.5, "travel_warning": 0.85}
  fr: {"vert": 0.0, "jaune": 0.2, "orange": 0.55, "rouge": 0.85}
  il: {"1": 0.0, "2": 0.1, "3": 0.4, "4": 0.8}   # NSC levels for Europe mostly reflect antisemitism/terror

# Embassy staff posture overrides the level (strongest signal a government can send).
staff_posture:
  normal: 0.0
  limited_consular_services: 0.6
  authorized_departure: 0.9
  ordered_departure: 1.0
  embassy_suspended: 1.0

# One-off advisory updates without a level change (e.g. new wording about troop build-ups).
# Event signals in block A: they decay with the block half-life; reason relevance applies.
advisory_events:
  level_raised: 0.4
  staff_posture: 0.6
  consular: 0.4
  borders: 0.4
  airspace: 0.4
  security_update: 0.25

# Border closures stated in advisories (block C, state while the advisory says so).
borders_closed_strength: 0.7

# Only tier 1-2 sources count on their own; tier 3-4 need confirmation.
verification:
  max_unconfirmed_tier: 2

# A source that swings between two texts (A -> B -> A) within this many days is
# flapping (e.g. CDN nodes serving different versions): no change, no event.
flap_window_days: 7

# Surge bonus: how far above the country's own norm it is right now.
baseline:
  window_days: 180
  min_history_days: 30        # below this, no surge bonus (not enough history)
  surge_weight: 0.5           # R_adj = R + surge_weight * max(0, R - baseline_median)

# Cross-government synchrony: several governments tightening within a week.
synchrony:
  window_days: 7
  min_governments: 3
  multiplier: 1.2

# Regional comparison (peer groups from countries.py). Flags only, no score change by default.
regional:
  surge_threshold: 0.10       # deviation from own norm considered a surge
  isolated_factor: 1.0        # set <1 to damp scores that rise alone while peers stay flat
  regional_share: 0.5         # share of peers surging to call it a regional escalation

# Hard floors: specific events guarantee a minimum score (keeps the scale interpretable).
floors:
  # `when` may list several kinds; stronger postures also satisfy weaker rules.
  - {when: ["staff_posture:ordered_departure", "staff_posture:embassy_suspended"], min_governments: 2, score: 9.0}
  - {when: ["staff_posture:authorized_departure", "staff_posture:ordered_departure", "staff_posture:embassy_suspended"], min_governments: 1, score: 7.0}
  - {when: "domestic:mobilisation", min_governments: 0, score: 9.0}
  - {when: "aviation:airspace_closed", min_governments: 0, score: 8.0}
  - {when: "aviation:airspace_restricted", min_governments: 0, score: 6.0}

# Minimum share of blocks with fresh data to publish a score.
min_coverage: 0.5

levels:
  - {max: 2.99, key: green}
  - {max: 4.99, key: yellow}
  - {max: 6.99, key: orange}
  - {max: 8.99, key: red}
  - {max: 10.0, key: critical}

# score = 10 * R_adj ** curve_gamma. gamma < 1 spreads the low end of the scale so early,
# moderate signals are visible; decisive events are handled by floors.
curve_gamma: 0.7
