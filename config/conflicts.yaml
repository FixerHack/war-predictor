# Curated war/conflict status on each monitored country's own territory.
# Source of truth for the bot's "war status" line. Changes are made by a human after review:
# `tension-index war-check --notify` compares this file with automatic trackers and alerts
# admins about mismatches, it never edits this file itself.
#
# status: none | frozen | clashes | active | war
#   frozen  - occupation or frozen conflict without regular hostilities (RULAC "military occupation")
#   clashes - sporadic armed incidents (Wikipedia: fewer than 100 deaths/yr)
#   active  - ongoing armed conflict (100-999 deaths/yr)
#   war     - war (1,000+ deaths/yr)
# borders_war: neighbours with a war on their territory (context line in the bot)
# borders_aggressor: land borders with Russia / Belarus
# wikipedia_ignore: Wikipedia conflicts reviewed as unrelated to the country's European
#   territory (overseas regions, etc.). Exact conflict name as `war-check --explain` prints it.

reviewed: 2026-09-30
default: {status: none}

countries:
  MD:
    status: frozen
    note_uk: "Придністров'я: військова присутність Росії з 1992 року (RULAC: окупація)"
    note_en: "Transnistria: Russian military presence since 1992 (RULAC: military occupation)"
    source: "RULAC (https://www.rulac.org), Moldova: military occupation of Transdniestria"
    borders_war: [UA]
  CY:
    status: frozen
    note_uk: "Північ острова під контролем Туреччини з 1974 року (RULAC: окупація)"
    note_en: "Northern Cyprus under Turkish control since 1974 (RULAC: military occupation)"
    source: "RULAC (https://www.rulac.org), Cyprus: military occupation by Turkey"
  FR:
    status: none
    wikipedia_ignore:
      - conflict: "Brazilian drug war"
        reason_uk: "Французька Гвіана (Південна Америка), не європейська територія"
        reason_en: "French Guiana (South America), not European territory"
  PL: {status: none, borders_war: [UA], borders_aggressor: [BY, RU]}
  LT: {status: none, borders_aggressor: [BY, RU]}
  LV: {status: none, borders_aggressor: [BY, RU]}
  EE: {status: none, borders_aggressor: [RU]}
  FI: {status: none, borders_aggressor: [RU]}
  NO: {status: none, borders_aggressor: [RU]}
  SK: {status: none, borders_war: [UA]}
  HU: {status: none, borders_war: [UA]}
  RO: {status: none, borders_war: [UA]}

# Neighbours outside the monitored set, shown on the public map for context only (no score).
# role: at_war (war on its territory) | aggressor (wages the war) | aggressor_ally (territory
# used for the attack). Added 2026-10-01 at the user's request; review like the rest.
context:
  UA:
    status: war
    role: at_war
    note_uk: "Повномасштабна війна після вторгнення Росії 24.02.2022"
    note_en: "Full-scale war since Russia's invasion on 24 Feb 2022"
    source: "RULAC (https://www.rulac.org): international armed conflict, Russia v. Ukraine"
  RU:
    status: war
    role: aggressor
    note_uk: "Веде війну проти України з 2014 року, повномасштабну — з 24.02.2022"
    note_en: "Waging war against Ukraine since 2014, full-scale since 24 Feb 2022"
    source: "RULAC (https://www.rulac.org): international armed conflict, Russia v. Ukraine"
  BY:
    status: none
    role: aggressor_ally
    note_uk: "Територію використано для вторгнення в Україну у 2022 році"
    note_en: "Territory used for the invasion of Ukraine in 2022"
    source: "UN General Assembly resolution ES-11/1 (2 March 2022)"
