name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: PLAN.md is in sync with roadmap.yaml
        run: |
          uv run tension-index roadmap --out _site
          git diff --exit-code PLAN.md PLAN.en.md || {
            echo "::error::Run 'uv run tension-index roadmap' and commit PLAN.md / PLAN.en.md"; exit 1; }
