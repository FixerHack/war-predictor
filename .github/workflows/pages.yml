name: Progress page

# Pages is served from the `gh-pages` branch (Settings -> Pages -> Deploy from a branch).
# This workflow only refreshes that branch; `make pages` does the same by hand.
on:
  push:
    branches: [main]
    paths: [roadmap/**, site/**, src/tension_index/roadmap.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish_pages.sh
