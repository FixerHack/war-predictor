<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tension Index · Europe</title>
<meta name="description" content="Escalation-signal indicator for European countries (0–10). Not a forecast.">
<!-- Data: scores.json next to this page, written by `tension-index export`. -->
<style>
:root {
  --bg: #f4f5f3; --surface: #fcfcfb; --ink: #1b2129; --ink-2: #4a5462; --ink-3: #6b7480;
  --line: #d6dad6; --focus: #2d5b8c; --empty: #e4e6e2; --empty-ink: #4a5462;
  /* Ordinal ramp, one warm hue, validated (light surface): green -> critical */
  --l0: #e0a080; --l1: #d67a55; --l2: #c2553a; --l3: #9c3527; --l4: #6f2019;
  --on0: #1b2129; --on1: #1b2129; --on2: #ffffff; --on3: #ffffff; --on4: #ffffff;
  --chart: #1b2129; --band: rgba(156, 53, 39, 0.07);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121412; --surface: #1a1a19; --ink: #e8eae6; --ink-2: #aab1b9; --ink-3: #8a929b;
    --line: #33373a; --focus: #7fa9d6; --empty: #26292a; --empty-ink: #aab1b9;
    /* Dark: its own steps, brighter = higher (validated on #1a1a19) */
    --l0: #7d3a2a; --l1: #a44a32; --l2: #c9643f; --l3: #e38a62; --l4: #f5b597;
    --on0: #ffffff; --on1: #ffffff; --on2: #121412; --on3: #121412; --on4: #121412;
    --chart: #e8eae6; --band: rgba(227, 138, 98, 0.08);
  }
}
:root[data-theme="dark"] {
  --bg: #121412; --surface: #1a1a19; --ink: #e8eae6; --ink-2: #aab1b9; --ink-3: #8a929b;
  --line: #33373a; --focus: #7fa9d6; --empty: #26292a; --empty-ink: #aab1b9;
  --l0: #7d3a2a; --l1: #a44a32; --l2: #c9643f; --l3: #e38a62; --l4: #f5b597;
  --on0: #ffffff; --on1: #ffffff; --on2: #121412; --on3: #121412; --on4: #121412;
  --chart: #e8eae6; --band: rgba(227, 138, 98, 0.08);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-variant-numeric: tabular-nums; padding-bottom: env(safe-area-inset-bottom, 0); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
h1 { font-size: clamp(1.4rem, 4vw, 2.1rem); margin: 0; line-height: 1.15; }
.meta { color: var(--ink-2); font-size: 0.9rem; margin-top: 4px; }
.controls { display: flex; gap: 6px; }
.btn { font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); }
.btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.notice { margin: 18px 0; padding: 12px 14px; background: var(--surface); border-left: 4px solid var(--l2);
  border-radius: 0 6px 6px 0; font-size: 0.92rem; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.85rem; color: var(--ink-2); margin: 8px 0 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.map { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.tile { appearance: none; border: 0; border-radius: 6px; aspect-ratio: 1 / 1; padding: 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font: inherit;
  background: var(--empty); color: var(--empty-ink); min-width: 0; }
.tile .c { font-weight: 700; font-size: clamp(0.62rem, 1.9vw, 0.95rem); line-height: 1; }
.tile .v { font-size: clamp(0.58rem, 1.6vw, 0.82rem); line-height: 1.2; }
.tile[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.panel h2 { margin: 0; font-size: 1.25rem; }
.big { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 4px; }
.big .n { font-size: 2.6rem; font-weight: 700; line-height: 1; }
.big .lv { color: var(--ink-2); }
.panel ul { margin: 6px 0 0; padding-left: 18px; }
.panel li { margin: 4px 0; font-size: 0.92rem; }
.sub { font-weight: 600; margin-top: 14px; font-size: 0.95rem; }
.muted { color: var(--ink-3); font-size: 0.85rem; }
svg.chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.8rem;
  padding: 4px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -120%); display: none; }
.chartbox { position: relative; }
details { margin-top: 24px; }
summary { cursor: pointer; font-weight: 600; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-2); font-weight: 600; }
td.num { text-align: right; }
section.method { margin-top: 28px; font-size: 0.95rem; color: var(--ink-2); }
section.method h2 { font-size: 1.1rem; color: var(--ink); }
footer { margin-top: 28px; font-size: 0.8rem; color: var(--ink-3); }
a { color: var(--focus); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Індекс напруги: Європа</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="controls">
      <button class="btn" data-lang="uk" type="button">УКР</button>
      <button class="btn" data-lang="en" type="button">ENG</button>
      <button class="btn" id="themeBtn" type="button" aria-label="Theme">◐</button>
    </div>
  </header>
  <div class="notice" id="notice"></div>
  <div class="legend" id="legend"></div>
  <div class="cols">
    <div>
      <div class="map" id="map" role="group"></div>
      <p class="muted" id="maphint"></p>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>
  <details id="tablebox"><summary id="tabletitle"></summary><div id="table"></div></details>
  <section class="method" id="method"></section>
  <footer id="foot"></footer>
</div>
<script>
const GRID = { // approximate geography, 9 columns
  IS:[0,0], NO:[4,0], SE:[5,0], FI:[6,0], EE:[7,0],
  IE:[1,1], GB:[2,1], DK:[4,1], LV:[7,1],
  BE:[2,2], NL:[3,2], DE:[4,2], PL:[5,2], LT:[6,2],
  FR:[2,3], LU:[3,3], CZ:[4,3], SK:[5,3],
  ES:[1,4], CH:[3,4], AT:[4,4], HU:[5,4], RO:[6,4], MD:[7,4],
  PT:[0,5], IT:[3,5], SI:[4,5], HR:[5,5], RS:[6,5], BG:[7,5],
  MT:[3,6], BA:[5,6], ME:[6,6], XK:[7,6],
  AL:[6,7], MK:[7,7], GR:[7,8], CY:[8,8],
};
const LEVELS = ["green", "yellow", "orange", "red", "critical"];
const WAR = { none: "", frozen: "🧊", clashes: "🟠", active: "🔴", war: "🟥" };
const T = {
  uk: { title: "Індекс напруги: Європа", updated: "Оновлено", nodata: "немає даних",
        notice: "Індикатор стану сигналів ескалації (0–10) за офіційними рекомендаціями урядів, авіацією, новинами й ринками. Це не прогноз і не порада щодо виїзду.",
        levels: { green: "0–2 низький: базовий фон", yellow: "3–4 помірний: поодинокі зміни", orange: "5–6 підвищений: кілька блоків", red: "7–8 високий: виїзд персоналу, небо", critical: "9–10 критичний" },
        lvl: { green: "низький", yellow: "помірний", orange: "підвищений", red: "високий", critical: "критичний" },
        hint: "Натисніть на країну, щоб побачити деталі. Посилання на країну: …/dashboard/#PL",
        war: "Статус війни", why: "Чому", flags: "Позначки", history: "Бал за 90 днів", calibrating: "⏳ Даних ще недостатньо для балу.",
        warS: { none: "збройного конфлікту немає", frozen: "заморожений конфлікт / окупація частини території", clashes: "окремі збройні інциденти", active: "збройний конфлікт", war: "війна" },
        table: "Таблиця всіх країн", country: "Країна", score: "Бал", level: "Рівень",
        methodTitle: "Як рахується", method: "Шість блоків сигналів (рекомендації урядів і статус посольств, авіація, внутрішні заходи, сигнали агресора, медіа, ринки) поєднуються як незалежні підтвердження. Важать причина, кількість незалежних джерел, синхронність держав і відхилення від звичного рівня країни. Вирішальні події (виїзд персоналу посольств, закриття неба, мобілізація) гарантують мінімальний бал. Ваги — стартова гіпотеза, їх перевіряють на історичних епізодах.",
        algo: "Алгоритм", sources: "Джерела", progress: "Хід проєкту", empty: "Даних ще немає: панель заповниться після першого розрахунку.", tt: "бал" },
  en: { title: "Tension Index: Europe", updated: "Updated", nodata: "no data",
        notice: "An indicator of escalation signals (0–10) from governments' travel advice, aviation, news and markets. Not a forecast and not advice to leave.",
        levels: { green: "0–2 low: baseline", yellow: "3–4 moderate: isolated changes", orange: "5–6 elevated: several blocks", red: "7–8 high: staff departure, airspace", critical: "9–10 critical" },
        lvl: { green: "low", yellow: "moderate", orange: "elevated", red: "high", critical: "critical" },
        hint: "Select a country for details. Link to a country: …/dashboard/#PL",
        war: "War status", why: "Why", flags: "Flags", history: "Score, last 90 days", calibrating: "⏳ Not enough data for a score yet.",
        warS: { none: "no armed conflict", frozen: "frozen conflict / partial occupation", clashes: "sporadic armed clashes", active: "armed conflict", war: "war" },
        table: "Table of all countries", country: "Country", score: "Score", level: "Level",
        methodTitle: "How it is scored", method: "Six signal blocks (government advice and embassy posture, aviation, domestic measures, aggressor signals, media, markets) combine as independent confirmations. What counts: the stated reason, the number of independent sources, governments acting in sync, and deviation from the country's usual level. Decisive events (embassy staff departure, airspace closure, mobilisation) guarantee a minimum score. Weights are a starting hypothesis, tested on historical episodes.",
        algo: "Algorithm", sources: "Sources", progress: "Project progress", empty: "No data yet: the dashboard fills in after the first scoring run.", tt: "score" },
};
const REPO = "https://github.com/FixerHack/war-predictor/blob/main/";
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let lang = store.get("lang") === "en" ? "en" : "uk";
let data = null;
let selected = (location.hash || "").slice(1).toUpperCase() || null;

const idx = (level) => LEVELS.indexOf(level);
const fill = (c) => c && c.score != null && idx(c.level) >= 0 ? `var(--l${idx(c.level)})` : "var(--empty)";
const ink = (c) => c && c.score != null && idx(c.level) >= 0 ? `var(--on${idx(c.level)})` : "var(--empty-ink)";

function renderLegend() {
  const t = T[lang];
  document.getElementById("legend").innerHTML = LEVELS.map((l, i) =>
    `<span><span class="sw" style="background:var(--l${i})"></span>${esc(t.levels[l])}</span>`).join("") +
    `<span><span class="sw" style="background:var(--empty)"></span>⏳ ${esc(t.nodata)}</span>`;
}

function renderMap() {
  const map = document.getElementById("map");
  map.setAttribute("aria-label", T[lang].title);
  map.innerHTML = Object.entries(GRID).map(([code, [col, row]]) => {
    const c = data?.countries?.[code];
    const name = c ? c.name[lang] : code;
    const val = c && c.score != null ? c.score.toFixed(1) : "⏳";
    const war = c ? WAR[c.war.status] : "";
    const label = `${name}: ${c && c.score != null ? `${val} (${T[lang].lvl[c.level]})` : T[lang].nodata}`;
    return `<button class="tile" type="button" data-code="${code}" aria-pressed="${code === selected}"
      title="${esc(label)}" aria-label="${esc(label)}"
      style="grid-column:${col + 1};grid-row:${row + 1};background:${fill(c)};color:${ink(c)}">
      <span class="c">${code}</span><span class="v">${esc(val)}${war ? " " + war : ""}</span></button>`;
  }).join("");
  map.querySelectorAll(".tile").forEach((b) => b.onclick = () => select(b.dataset.code));
}

function chart(history) {
  const W = 480, H = 170, L = 26, R = 8, TOP = 8, B = 20;
  const pts = history.map(([d, v]) => ({ d, v }));
  if (!pts.length) return "";
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => TOP + (1 - v / 10) * (H - TOP - B);
  const grid = [0, 3, 5, 7, 9, 10].map((v) =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v % 10 ? 'stroke-dasharray="3 3"' : ""}/>` +
    `<text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  let path = "", open = false;
  pts.forEach((p, i) => {
    if (p.v == null) { open = false; return; }
    path += `${open ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`; open = true;
  });
  const last = [...pts.keys()].reverse().find((i) => pts[i].v != null);
  const marker = last != null ? `<circle cx="${x(last)}" cy="${y(pts[last].v)}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>` : "";
  const first = pts[0].d, lastD = pts[pts.length - 1].d;
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T[lang].history)}">
    ${grid}<path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${marker}<line class="cross" y1="${TOP}" y2="${H - B}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/>
    <text x="${L}" y="${H - 4}">${esc(first)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(lastD)}</text>
    <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}

function wireChart(history) {
  const box = document.querySelector(".chartbox");
  if (!box) return;
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), cross = svg.querySelector(".cross");
  const W = 480, L = 26, R = 8;
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const vx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(history.length - 1, Math.round(((vx - L) / (W - L - R)) * (history.length - 1))));
    const [d, v] = history[i];
    const px = L + (history.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (history.length - 1));
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.style.left = `${(px / W) * 100}%`; tip.style.top = "0";
    tip.textContent = `${d} · ${T[lang].tt} ${v == null ? "—" : v.toFixed(1)}`;
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerleave", hide);
}

function renderPanel() {
  const t = T[lang], panel = document.getElementById("panel");
  if (!data) { panel.innerHTML = `<p>${esc(t.empty)}</p>`; return; }
  const code = selected && data.countries[selected] ? selected
    : Object.entries(data.countries).sort((a, b) => (b[1].score ?? -1) - (a[1].score ?? -1))[0][0];
  const c = data.countries[code];
  const score = c.score != null
    ? `<div class="big"><span class="n">${c.score.toFixed(1)}</span><span class="lv">/ 10 · ${esc(t.lvl[c.level])}</span></div>`
    : `<p>${esc(t.calibrating)}</p>`;
  const war = `<div class="sub">${esc(t.war)}</div><div>${WAR[c.war.status] || "🟢"} ${esc(t.warS[c.war.status])}${c.war.note[lang] ? `<div class="muted">${esc(c.war.note[lang])}</div>` : ""}</div>`;
  const why = c.reasons[lang].length ? `<div class="sub">${esc(t.why)}</div><ul>${c.reasons[lang].map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
  const flags = c.flags[lang].length ? `<div class="sub">${esc(t.flags)}</div><ul>${c.flags[lang].map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
  const hist = c.history.length ? `<div class="sub">${esc(t.history)}</div>${chart(c.history)}` : "";
  panel.innerHTML = `<h2>${c.flag} ${esc(c.name[lang])}</h2>${score}${why}${flags}${war}${hist}` +
    (c.updated ? `<p class="muted">${esc(t.updated)}: ${esc(c.updated.replace("T", " ").slice(0, 16))} UTC</p>` : "");
  wireChart(c.history);
}

function renderTable() {
  const t = T[lang];
  document.getElementById("tabletitle").textContent = t.table;
  if (!data) { document.getElementById("table").innerHTML = ""; return; }
  const rows = Object.entries(data.countries).sort((a, b) => (b[1].score ?? -1) - (a[1].score ?? -1) || a[1].name[lang].localeCompare(b[1].name[lang]));
  document.getElementById("table").innerHTML = `<table><thead><tr><th>${esc(t.country)}</th><th class="num">${esc(t.score)}</th><th>${esc(t.level)}</th><th>${esc(t.war)}</th></tr></thead><tbody>` +
    rows.map(([code, c]) => `<tr><td>${c.flag} ${esc(c.name[lang])}</td><td class="num">${c.score != null ? c.score.toFixed(1) : "—"}</td>` +
      `<td>${c.score != null ? esc(t.lvl[c.level]) : "⏳"}</td><td>${WAR[c.war.status] || "🟢"} ${esc(t.warS[c.war.status])}</td></tr>`).join("") +
    `</tbody></table>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("title").textContent = t.title;
  document.title = t.title;
  document.getElementById("notice").textContent = t.notice;
  document.getElementById("maphint").textContent = t.hint;
  document.getElementById("meta").textContent = data ? `${t.updated}: ${data.generated_at.replace("T", " ").slice(0, 16)} UTC` : "";
  document.getElementById("method").innerHTML = `<h2>${esc(t.methodTitle)}</h2><p>${esc(t.method)}</p>` +
    `<p><a href="${REPO}docs/algorithm.md">${esc(t.algo)}</a> · <a href="${REPO}docs/sources.md">${esc(t.sources)}</a> · <a href="../">${esc(t.progress)}</a></p>`;
  document.getElementById("foot").textContent = data ? `v${data.version}` : "";
  renderLegend(); renderMap(); renderPanel(); renderTable();
}

function select(code) {
  selected = code;
  history.replaceState(null, "", `#${code}`);
  renderMap(); renderPanel();
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); render(); }));
const savedTheme = store.get("theme");
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next);
});
window.addEventListener("hashchange", () => { const c = location.hash.slice(1).toUpperCase(); if (c) select(c); });

render();
fetch("scores.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((json) => { data = json; render(); })
  .catch(() => { data = null; render(); });
</script>
</body>
</html>
